<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>代付帳 · 連線邀請</title>
<!--
  代付帳 / Owely 2.1 連線邀請落地頁。零伺服器：邀請內容在 URL 的 #fragment 裡，GitHub Pages 收不到。
  部署位置：Xun88888/owely-legal 的 l/index.html（https://xun88888.github.io/owely-legal/l/）。
  payload = base64url(JSON {v:2, t:"req", k:"lnk", lv:1, n:邀請人顯示名, u:iCloud 分享連結})。
  t/v 借用請款卡的形狀：舊版 2.0 會因此顯示「請先更新 App」而不是「連結無法讀取」（2026-11-21 真機實測後改）。
  為什麼要這一頁：直接傳 iCloud 分享連結，沒裝 App 的人只會看到通用的 iCloud 登入頁。
  「在 Owely 開啟」＝ owely://l#<同一份 payload>，App 內完成加入。
  沒裝 App 時按「開啟」不會有任何反應（LINE 內建瀏覽器只跳一個允許框，按了也沒事）→ 2.5 秒後頁面還在前景就顯示提示，
  並把「到 App Store 下載」變成主要按鈕（2026-11-21 真機實測後加）。不自動跳商店：已安裝的人可能只是慢慢按允許。
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F5F1E8;--card:#fff;--line:#E9E2D0;--ink:#242B26;--ink2:#5A645D;--emerald:#0E6B4E;--emerald-hi:#128763;--emerald-soft:#E4EFE8;--gold-line:#D8C089}
@media (prefers-color-scheme:dark){:root{--bg:#0E1512;--card:#171F1B;--line:#26322B;--ink:#E9EFE9;--ink2:#A3AEA7;--emerald:#41C494;--emerald-hi:#55D6A6;--emerald-soft:#143127;--gold-line:#8A7340}}
body{font-family:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans CJK TC",sans-serif;background:var(--bg);color:var(--ink);padding:18px 16px 40px;max-width:430px;margin:0 auto;line-height:1.5}
.lang{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:10px}
.lang button{font:inherit;font-size:13px;padding:6px 12px;min-height:32px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.lang button.on{background:var(--emerald);color:#fff;border-color:var(--emerald)}
@media (prefers-color-scheme:dark){.lang button.on{color:#0B241B}}
.brandrow{display:flex;align-items:center;gap:10px;margin:6px 4px 14px;font-weight:800;font-size:17px}
.brandrow i{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3A46C8,#8A4FE8);display:inline-block}
.card{border-radius:26px;position:relative;overflow:hidden;color:#F2EFE4;background:linear-gradient(155deg,#117657,#0B5540 55%,#084232);padding:24px 26px 22px;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(0,0,0,.22)}
.card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.022) 0 2px,transparent 2px 7px);pointer-events:none}
.card::after{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(222,193,122,.45);border-radius:18px;pointer-events:none}
.kicker{font-family:"Songti TC","Songti SC",serif;font-weight:700;font-size:13px;letter-spacing:.12em}
.who{margin-top:22px;font-size:16px;color:rgba(242,239,228,.82)}
.big{font-family:"Songti TC","Songti SC","Hiragino Mincho ProN",serif;font-weight:800;font-size:40px;line-height:1.2;margin-top:2px}
.pts{margin-top:16px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:rgba(242,239,228,.94)}
.pts div{display:flex;gap:10px}.pts b{color:#DEC17A}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;border:0;font:inherit;font-size:17px;font-weight:800;text-align:center;cursor:pointer;text-decoration:none}
.btn small{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:2px}
.btn.pri{color:#fff;background:linear-gradient(135deg,var(--emerald-hi),var(--emerald));box-shadow:0 10px 24px rgba(14,107,78,.28)}
@media (prefers-color-scheme:dark){.btn.pri{color:#0B241B}}
.btn.sec{color:var(--emerald);background:var(--card);border:1px solid var(--emerald)}
.steps{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:16px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.steps div{display:flex;gap:10px;align-items:flex-start}
.steps i{flex:0 0 24px;height:24px;border-radius:12px;background:var(--emerald-soft);color:var(--emerald);font-style:normal;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.note{font-size:13px;color:var(--ink2);margin:16px 6px 0}
.note a{color:var(--emerald)}
.miss{background:var(--emerald-soft);border:1px solid var(--emerald);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;color:var(--ink)}
.err{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
</style>
</head>
<body>
<div class="lang" id="lang"></div>
<div id="app"></div>
<script>
const I18N = {
  'zh-Hant': {miss:'沒有反應？這支手機可能還沒安裝 Owely。先按下面的按鈕下載，裝好後回到這一頁，再按一次「在 Owely 開啟邀請」。', upd:'打不開？請先到 App Store 把 Owely 更新到最新版。', title:'代付帳 · 連線邀請', brand:'Owely 代付帳', kicker:'代付帳 · 連線邀請', who:(n)=>`${n} 邀你`, whoAnon:'朋友邀你', big:'一起對帳',
    p1:'誰先墊了錢，兩邊帳本都記得', p2:'對方的帳，你確認才入帳', p3:'資料只在你們的 iCloud',
    open:'在 Owely 開啟邀請', openSub:'已經安裝的話，點這裡', get:'還沒安裝？到 App Store 下載', getSub:'免費',
    s1:'下載 Owely（免費）', s2:'回到這個頁面，按「在 Owely 開啟邀請」', s3:(n)=>`選擇 ${n} 是你的哪位聯絡人，完成`, s3Anon:'選擇對方是你的哪位聯絡人，完成',
    note:'需要 iPhone 並登入 iCloud。帳目只存在你們各自的 iCloud，Owely 沒有伺服器，看不到內容。邀請 7 天內有效，只有第一個加入的人算數。', privacy:'隱私權政策',
    bad:'這個邀請連結無法讀取。請對方重新傳一次。', newer:'這個邀請來自較新版本的 Owely，請先更新 App。'},
  'zh-Hans': {miss:'没有反应？这台手机可能还没安装 Owely。先点下面的按钮下载，装好后回到这一页，再点一次「在 Owely 打开邀请」。', upd:'打不开？请先到 App Store 把 Owely 更新到最新版。', title:'代付帳 · 连线邀请', brand:'Owely 代付帳', kicker:'代付帳 · 连线邀请', who:(n)=>`${n} 邀你`, whoAnon:'朋友邀你', big:'一起对账',
    p1:'谁先垫了钱，两边账本都记得', p2:'对方的账，你确认才入账', p3:'资料只在你们的 iCloud',
    open:'在 Owely 打开邀请', openSub:'已经安装的话，点这里', get:'还没安装？到 App Store 下载', getSub:'免费',
    s1:'下载 Owely（免费）', s2:'回到这个页面，点「在 Owely 打开邀请」', s3:(n)=>`选择 ${n} 是你的哪位联系人，完成`, s3Anon:'选择对方是你的哪位联系人，完成',
    note:'需要 iPhone 并登入 iCloud。账目只存在你们各自的 iCloud，Owely 没有服务器，看不到内容。邀请 7 天内有效，只有第一个加入的人算数。', privacy:'隐私政策',
    bad:'这个邀请链接无法读取。请对方重新发一次。', newer:'这个邀请来自较新版本的 Owely，请先更新 App。'},
  'en': {miss:'Nothing happened? Owely may not be installed on this iPhone yet. Download it with the button below, then come back to this page and tap “Open Invite in Owely” again.', upd:'Not opening? Update Owely to the latest version in the App Store first.', title:'Owely · Link Invite', brand:'Owely', kicker:'OWELY · LINK INVITE', who:(n)=>`${n} invites you to`, whoAnon:'A friend invites you to', big:'Link Ledgers',
    p1:'Who paid first — both ledgers remember', p2:'Nothing posts until you confirm', p3:'Data stays in your own iCloud',
    open:'Open Invite in Owely', openSub:'Already installed? Tap here', get:'Get Owely on the App Store', getSub:'Free',
    s1:'Download Owely (free)', s2:'Come back to this page and tap “Open Invite in Owely”', s3:(n)=>`Choose which of your contacts ${n} is — done`, s3Anon:'Choose which of your contacts they are — done',
    note:'Requires an iPhone signed in to iCloud. Entries live only in each person’s own iCloud; Owely has no server and can’t see them. The invite is valid for 7 days, and only the first person to join counts.', privacy:'Privacy Policy',
    bad:"This invite link can't be read. Ask for it to be sent again.", newer:'This invite was made with a newer version of Owely. Please update the app first.'},
  'ja': {miss:'反応がない場合は、この iPhone に Owely がまだ入っていない可能性があります。下のボタンからダウンロードし、このページに戻ってもう一度「Owely で招待を開く」をタップしてください。', upd:'開けない場合は、App Store で Owely を最新バージョンにアップデートしてください。', title:'Owely · 連携の招待', brand:'Owely', kicker:'OWELY · 連携の招待', who:(n)=>`${n} さんから`, whoAnon:'友だちから', big:'帳簿を連携',
    p1:'立て替えの記録が双方の帳簿に残る', p2:'相手の記録は、確認してから反映', p3:'データは二人の iCloud にだけ保存',
    open:'Owely で招待を開く', openSub:'インストール済みの方はこちら', get:'App Store で Owely を入手', getSub:'無料',
    s1:'Owely をダウンロード（無料）', s2:'このページに戻り、「Owely で招待を開く」をタップ', s3:(n)=>`${n} さんがどの連絡先かを選んで完了`, s3Anon:'相手がどの連絡先かを選んで完了',
    note:'iCloud にサインインした iPhone が必要です。記録はそれぞれの iCloud にのみ保存され、Owely にサーバーはなく内容を見ることはできません。招待は 7 日間有効で、最初に参加した 1 人だけが対象です。', privacy:'プライバシーポリシー',
    bad:'この招待リンクは読み込めません。もう一度送ってもらってください。', newer:'この招待は新しいバージョンの Owely で作成されています。先に App をアップデートしてください。'},
  'ko': {miss:'반응이 없나요? 이 iPhone에 아직 Owely가 설치되어 있지 않을 수 있습니다. 아래 버튼으로 다운로드한 뒤 이 페이지로 돌아와 “Owely에서 초대 열기”를 다시 누르세요.', upd:'열리지 않나요? App Store에서 Owely를 최신 버전으로 업데이트하세요.', title:'Owely · 연결 초대', brand:'Owely', kicker:'OWELY · 연결 초대', who:(n)=>`${n} 님의 초대`, whoAnon:'친구의 초대', big:'장부 연결',
    p1:'누가 먼저 냈는지 양쪽 장부에 기록', p2:'상대의 내역은 확인 후에만 기록', p3:'데이터는 두 사람의 iCloud에만 저장',
    open:'Owely에서 초대 열기', openSub:'이미 설치했다면 여기를 누르세요', get:'App Store에서 Owely 받기', getSub:'무료',
    s1:'Owely 다운로드(무료)', s2:'이 페이지로 돌아와 “Owely에서 초대 열기”를 누르기', s3:(n)=>`${n} 님이 어느 연락처인지 선택하면 완료`, s3Anon:'상대가 어느 연락처인지 선택하면 완료',
    note:'iCloud에 로그인한 iPhone이 필요합니다. 내역은 각자의 iCloud에만 저장되며, Owely에는 서버가 없어 내용을 볼 수 없습니다. 초대는 7일간 유효하며 처음 참여한 한 명만 인정됩니다.', privacy:'개인정보 처리방침',
    bad:'이 초대 링크를 읽을 수 없습니다. 다시 보내 달라고 요청하세요.', newer:'이 초대는 최신 버전의 Owely로 만들어졌습니다. 먼저 앱을 업데이트하세요.'}
};
// 活動代碼 ct=link-invite：在 App Store Connect「App 分析 → 來源 → 活動」看這個頁面帶來的下載（要搭配 pt=供應商代碼才會被統計）。
const APPSTORE = 'https://apps.apple.com/app/id6788934177?ct=link-invite';
const PRIVACY = 'https://xun88888.github.io/owely-legal/';

function pickLang(){ const n=(navigator.language||'zh-Hant').toLowerCase(); if(n.startsWith('zh')) return (n.includes('hans')||n.includes('cn')||n.includes('sg'))?'zh-Hans':'zh-Hant'; if(n.startsWith('ja')) return 'ja'; if(n.startsWith('ko')) return 'ko'; return 'en'; }
let lang = pickLang();
function b64urlDecode(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return decodeURIComponent(escape(atob(s))); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// 只接受蘋果的分享連結；payload 原樣轉交給 App（App 端會再驗一次）。
function okShare(u){ try{ const x=new URL(u); return x.protocol==='https:' && x.hostname==='www.icloud.com' && x.pathname.startsWith('/share/'); }catch(e){ return false; } }
function parse(){ const h=location.hash.replace(/^#/,''); if(!h) return {error:'bad'}; try{ const o=JSON.parse(b64urlDecode(h)); const isLink=(o.k==='lnk')||(o.t==='lnk'); if(!isLink) return {error:'bad'}; if((o.lv||1)>1) return {error:'newer'}; if(okShare(o.u) && /^[A-Za-z0-9_-]+$/.test(h)) return {payload:o,raw:h}; return {error:'bad'}; }catch(e){ return {error:'bad'}; } }

function render(){
  const T=I18N[lang]; const app=document.getElementById('app'); const r=parse();
  document.title=T.title; document.documentElement.lang=lang;
  document.getElementById('lang').innerHTML = Object.keys(I18N).map(l=>`<button class="${l===lang?'on':''}" data-l="${l}">${{'zh-Hant':'繁中','zh-Hans':'简中',en:'EN',ja:'日本語',ko:'한국어'}[l]}</button>`).join('');
  document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render();});
  const brand=`<div class="brandrow"><i></i>${T.brand}</div>`;
  if(r.error){ app.innerHTML=`${brand}<div class="err">${T[r.error]}</div><div class="stack"><a class="btn sec" href="${APPSTORE}">${T.get}</a></div>`; return; }
  const name=String(r.payload.n||'').trim().slice(0,40);
  app.innerHTML=`${brand}
  <div class="card">
    <div class="kicker">${T.kicker}</div>
    <div class="who">${name?T.who(esc(name)):T.whoAnon}</div>
    <div class="big">${T.big}</div>
    <div class="pts"><div><b>1</b><span>${T.p1}</span></div><div><b>2</b><span>${T.p2}</span></div><div><b>3</b><span>${T.p3}</span></div></div>
  </div>
  <div class="stack">
    <a class="btn ${missed?'sec':'pri'}" id="open" href="owely://l#${r.raw}">${T.open}<small>${T.openSub}</small></a>
    ${missed?`<div class="miss" id="miss" role="status">${T.miss}</div>`:''}
    <a class="btn ${missed?'pri':'sec'}" id="get" href="${APPSTORE}">${T.get}<small>${T.getSub}</small></a>
  </div>
  <p class="note" style="margin-top:10px;text-align:center">${T.upd}</p>
  <div class="steps"><div><i>1</i><span>${T.s1}</span></div><div><i>2</i><span>${T.s2}</span></div><div><i>3</i><span>${name?T.s3(esc(name)):T.s3Anon}</span></div></div>
  <p class="note">${T.note} <a href="${PRIVACY}">${T.privacy}</a></p>`;
  document.getElementById('open').addEventListener('click',()=>{
    left=false; clearTimeout(missTimer);
    missTimer=setTimeout(()=>{ if(left||document.visibilityState!=='visible'||missed) return; missed=true; render(); const m=document.getElementById('miss'); if(m&&m.scrollIntoView) m.scrollIntoView({block:'center',behavior:'smooth'}); },2500);
  });
}
// 按了「開啟」之後頁面有沒有離開前景：離開＝App 開起來了，不顯示提示。
let missed=false, left=false, missTimer=0;
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') left=true; });
window.addEventListener('pagehide',()=>{ left=true; });
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
